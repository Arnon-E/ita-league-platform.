<!doctype html>
<html lang="he" dir="rtl">

</style>
</helmet>

<div style="display:flex;align-items:center;gap:12px;padding:0 8px">
<div style="width:40px;height:40px;border-radius:50%;background:#D4F23C;display:flex;align-items:center;justify-content:center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0B2545" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M5 5.5c4 3 4 10 0 13M19 5.5c-4 3-4 10 0 13"></path></svg>
</div>
<div><div style="font-weight:800;font-size:18px">איגוד הטניס</div><div style="font-size:13px;color:#A9BAD1">מערכת ניהול</div></div>
</div>
<nav style="display:flex;flex-direction:column;gap:4px">
<a href="Dashboard.dc.html" style="display:flex;align-items:center;gap:12px;padding:12px;min-height:44px;box-sizing:border-box;border-radius:10px;color:#C9D6E8;font-size:15px;font-weight:500">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3h8v8H3zM13 3h8v5h-8zM13 10h8v11h-8zM3 13h8v8H3z"></path></svg>דשבורד</a>
<a href="Register.dc.html" style="display:flex;align-items:center;gap:12px;padding:12px;min-height:44px;box-sizing:border-box;border-radius:10px;color:#C9D6E8;font-size:15px;font-weight:500">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6v3H9zM6 5H5v16h14V5h-1M9 12h6M9 16h6"></path></svg>רישום שחקנים</a>
<a href="Tournament.dc.html" style="display:flex;align-items:center;gap:12px;padding:12px;min-height:44px;box-sizing:border-box;border-radius:10px;color:#C9D6E8;font-size:15px;font-weight:500">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"></path></svg>תחרויות</a>
<a href="Rankings.dc.html" style="display:flex;align-items:center;gap:12px;padding:12px;min-height:44px;box-sizing:border-box;border-radius:10px;background:#14427A;color:#ffffff;font-size:15px;font-weight:700">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V11M12 21V4M19 21v-7"></path></svg>דירוגים</a>
<a href="Notifications.dc.html" style="display:flex;align-items:center;gap:12px;padding:12px;min-height:44px;box-sizing:border-box;border-radius:10px;color:#C9D6E8;font-size:15px;font-weight:500">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 21a2 2 0 0 0 4 0"></path></svg>התראות</a>
<a href="Documents.dc.html" style="display:flex;align-items:center;gap:12px;padding:12px;min-height:44px;box-sizing:border-box;border-radius:10px;color:#C9D6E8;font-size:15px;font-weight:500">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v13H7zM14 3v5h5"></path></svg>מסמכים ואישורים</a>
<a href="Payments.dc.html" style="display:flex;align-items:center;gap:12px;padding:12px;min-height:44px;box-sizing:border-box;border-radius:10px;color:#C9D6E8;font-size:15px;font-weight:500">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18v12H3zM3 10h18M7 15h3"></path></svg>תשלומים</a>
<a href="Admin.dc.html" style="display:flex;align-items:center;gap:12px;padding:12px;min-height:44px;box-sizing:border-box;border-radius:10px;color:#C9D6E8;font-size:15px;font-weight:500">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"></path></svg>ניהול מערכת</a>
<a href="Import.dc.html" style="display:flex;align-items:center;gap:12px;padding:12px;min-height:44px;box-sizing:border-box;border-radius:10px;color:#C9D6E8;font-size:15px;font-weight:500">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"></path></svg>ייבוא מלוגליג</a>
</nav>
<div style="margin-top:auto;display:flex;align-items:center;gap:12px;padding:12px 8px;border-top:1px solid #1F3A5F">
<div style="width:40px;height:40px;border-radius:50%;background:#14427A;display:flex;align-items:center;justify-content:center;font-weight:700">דל</div>
<div><div style="font-weight:700;font-size:14px">דנה לוי</div><div style="font-size:12px;color:#A9BAD1">מנהלת תחרויות</div></div>
</div>
</aside>

<main style="flex:999 1 560px;min-width:0;padding:32px;box-sizing:border-box;display:flex;flex-direction:column;gap:24px">

<header style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px">
<div>
<h1 style="margin:0;font-size:28px;font-weight:800">דירוג ארצי</h1>
<p style="margin:4px 0 0;color:#55657A;font-size:15px">מתעדכן אוטומטית בסיום כל תחרות</p>
</div>
<button type="button" style="min-height:44px;padding:0 20px;border-radius:10px;border:1px solid #BCC8D6;background:#ffffff;color:#0B2545;font:inherit;font-weight:700;font-size:15px;cursor:pointer">ייצוא לאקסל</button>
</header>

<section style="display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between">
<div style="display:flex;flex-wrap:wrap;gap:8px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button type="button" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
</sc-for>
</div>
<label style="display:flex;flex-direction:column;gap:4px;flex:0 1 280px;min-width:200px;font-size:13px;font-weight:700;color:#55657A">
<span>חיפוש שחקן</span>
<input type="search" placeholder="שם או מועדון" style="height:44px;border:1px solid #BCC8D6;border-radius:10px;padding:0 14px;font:inherit;font-weight:400;font-size:15px;color:#0B2545;background:#ffffff;width:100%;box-sizing:border-box">
</label>
</section>

<section style="background:#ffffff;border:1px solid #DDE3EA;border-radius:16px;padding:8px 24px 16px;overflow-x:auto">
<table style="width:100%;min-width:560px;border-collapse:collapse;font-size:15px">
<thead>
<tr style="color:#55657A;font-size:13px;text-align:right">
<th style="padding:16px 8px;font-weight:700;text-align:right;width:64px">מקום</th>
<th style="padding:16px 8px;font-weight:700;text-align:right">שחקן/ית</th>
<th style="padding:16px 8px;font-weight:700;text-align:right">מועדון</th>
<th style="padding:16px 8px;font-weight:700;text-align:right">נקודות</th>
<th style="padding:16px 8px;font-weight:700;text-align:right">תחרויות</th>
<th style="padding:16px 8px;font-weight:700;text-align:right">שינוי</th>
</tr>
</thead>
<tbody>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
<tr style="border-top:1px solid #E8ECF1">
<td style="padding:14px 8px"><span style="{{r.rankStyle}}">{{r.rank}}</span></td>
<td style="padding:14px 8px;font-weight:700">{{r.name}}</td>
<td style="padding:14px 8px;color:#55657A">{{r.club}}</td>
<td style="padding:14px 8px;font-weight:800;font-variant-numeric:tabular-nums">{{r.points}}</td>
<td style="padding:14px 8px;font-variant-numeric:tabular-nums">{{r.events}}</td>
<td style="padding:14px 8px"><span style="{{r.moveStyle}}">{{r.move}}</span></td>
</tr>
</sc-for>
</tbody>
</table>
</section>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":1020}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { cat: "men" };
}
renderVals() {
const cat = this.state.cat;
const pill = (on) => on
? "min-height:44px;padding:0 20px;border-radius:999px;border:2px solid #14427A;background:#14427A;color:#ffffff;font:inherit;font-weight:700;font-size:15px;cursor:pointer"
: "min-height:44px;padding:0 20px;border-radius:999px;border:2px solid #BCC8D6;background:#ffffff;color:#0B2545;font:inherit;font-weight:500;font-size:15px;cursor:pointer";
const data = {
men: [
["דניאל כהן", "מועדון הדרום", 2840, 14, 2],
["גיא מזרחי", "מועדון השרון", 2615, 13, 0],
["איתמר רז", "מועדון הצפון", 2490, 15, 1],
["יונתן ברק", "מועדון הדרום", 2330, 12, -2],
["נועם לביא", "מועדון השרון", 2175, 11, 3],
["עומר דגן", "מועדון הצפון", 2040, 13, -1],
["תומר אשכנזי", "מועדון הדרום", 1925, 10, 0],
["אורי שמש", "מועדון השרון", 1810, 12, 1]
],
women: [
["מיכל פרידמן", "מועדון הצפון", 2710, 13, 1],
["הילה אורבך", "מועדון הדרום", 2560, 14, -1],
["שיר אלון", "מועדון השרון", 2395, 12, 0],
["רוני גולן", "מועדון הדרום", 2250, 11, 2],
["ליאור כץ", "מועדון הצפון", 2110, 12, -1],
["דנית מור", "מועדון השרון", 1990, 10, 0],
["יעל נחום", "מועדון הדרום", 1875, 9, 1],
["תמר בן ארי", "מועדון הצפון", 1760, 11, -2]
],
u16: [
["נועה אברהם", "מועדון הדרום", 1640, 9, 4],
["איתי רוזן", "מועדון הצפון", 1585, 10, 0],
["מאיה חדד", "מועדון השרון", 1510, 8, 1],
["אלון שני", "מועדון הדרום", 1440, 9, -1],
["ענבר לוי", "מועדון הצפון", 1385, 8, 2],
["רועי בן דוד", "מועדון השרון", 1320, 9, 0],
["שקד טל", "מועדון הדרום", 1255, 7, -3],
["עידו מימון", "מועדון הצפון", 1190, 8, 1]
]
};
const tabsRaw = [["men", "גברים"], ["women", "נשים"], ["u16", "נוער עד 16"]];
const base = "display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;border-radius:8px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;";
return {
tabs: tabsRaw.map(([k, l]) => ({ label: l, pressed: k === cat ? "true" : "false", style: pill(k === cat), pick: () => this.setState({ cat: k }) })),
rows: data[cat].map((r, i) => ({
rank: String(i + 1),
rankStyle: base + (i < 3 ? "background:#D4F23C;color:#0B2545" : "background:#F3F5F7;color:#55657A"),
name: r[0], club: r[1], points: String(r[2]), events: String(r[3]),
move: r[4] > 0 ? "↑ " + r[4] : (r[4] < 0 ? "↓ " + Math.abs(r[4]) : "–"),
moveStyle: "font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;color:" + (r[4] > 0 ? "#14663C" : (r[4] < 0 ? "#A3231A" : "#55657A"))
}))
};
}
}
</script>
</body>
</html>
