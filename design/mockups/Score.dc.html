<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>עדכון תוצאה</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
.stp{width:48px;height:48px;border-radius:12px;border:1px solid #BCC8D6;background:#ffffff;color:#0B2545;font:inherit;font-size:24px;font-weight:700;cursor:pointer;flex:none}
</style>
</helmet>
<div dir="rtl" style="width:390px;height:860px;box-sizing:border-box;background:#F3F5F7;color:#0B2545;font-family:'Heebo',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden">

<header style="background:#0B2545;color:#ffffff;padding:20px 20px 16px;display:flex;flex-direction:column;gap:6px">
<div style="display:flex;justify-content:space-between;align-items:center">
<a href="Tournament.dc.html" style="font-size:14px;color:#C9D6E8;min-height:44px;display:flex;align-items:center">חזרה ללוח</a>
<span style="display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#D4F23C;color:#0B2545">עדכון מהיר</span>
</div>
<div style="font-size:20px;font-weight:800">רבע גמר · משחק 3</div>
<div style="font-size:14px;color:#C9D6E8">מגרש מרכזי · 11:00 · הטוב מ-3 סטים</div>
</header>

<main style="flex:1;overflow:hidden;padding:16px 16px 0;display:flex;flex-direction:column;gap:12px">

<sc-for list="{{sets}}" as="s" hint-placeholder-count="3">
<div style="{{s.cardStyle}}">
<div style="font-size:13px;font-weight:800;color:#55657A">{{s.title}}</div>
<div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
<span style="font-size:15px;font-weight:700;flex:1;min-width:0">{{s.nameA}}</span>
<button type="button" class="stp" aria-label="הפחתת משחקון" onClick="{{s.decA}}">−</button>
<span style="width:32px;text-align:center;font-size:28px;font-weight:800;font-variant-numeric:tabular-nums">{{s.a}}</span>
<button type="button" class="stp" aria-label="הוספת משחקון" onClick="{{s.incA}}">+</button>
</div>
<div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
<span style="font-size:15px;font-weight:700;flex:1;min-width:0">{{s.nameB}}</span>
<button type="button" class="stp" aria-label="הפחתת משחקון" onClick="{{s.decB}}">−</button>
<span style="width:32px;text-align:center;font-size:28px;font-weight:800;font-variant-numeric:tabular-nums">{{s.b}}</span>
<button type="button" class="stp" aria-label="הוספת משחקון" onClick="{{s.incB}}">+</button>
</div>
</div>
</sc-for>

<div style="display:flex;gap:8px">
<button type="button" style="{{m1}}" onClick="{{setNormal}}">סיום רגיל</button>
<button type="button" style="{{m2}}" onClick="{{setRet}}">פרישה</button>
<button type="button" style="{{m3}}" onClick="{{setWo}}">ווק-אובר</button>
</div>

<div style="{{resultStyle}}">
<div style="font-size:16px;font-weight:800">{{resultTitle}}</div>
<div style="font-size:13px;line-height:1.5">{{resultNote}}</div>
</div>

</main>

<footer style="padding:12px 16px 20px;background:#F3F5F7">
<a href="Tournament.dc.html" style="display:flex;align-items:center;justify-content:center;min-height:54px;border-radius:14px;background:#14427A;color:#ffffff;font-weight:800;font-size:17px">שמירה ועדכון הלוח</a>
</footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":860}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { g: [[6, 4], [3, 6], [4, 2]], mode: "n" };
}
bump(i, side, d) {
const g = this.state.g.map((x) => x.slice());
g[i][side] = Math.max(0, Math.min(7, g[i][side] + d));
this.setState({ g });
}
renderVals() {
const g = this.state.g;
const A = "איתמר רז";
const B = "עומר דגן";
const won = (a, b) => a > b && a >= 6 && (a - b >= 2 || a === 7);
let sa = 0;
let sb = 0;
const sets = g.map((x, i) => {
const wa = won(x[0], x[1]);
const wb = won(x[1], x[0]);
if (wa) sa++;
if (wb) sb++;
return {
title: "סט " + (i + 1) + (wa ? " · " + A : (wb ? " · " + B : " · בהתקדמות")),
nameA: A, nameB: B, a: String(x[0]), b: String(x[1]),
cardStyle: "background:#ffffff;border:1px solid #DDE3EA;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px",
incA: () => this.bump(i, 0, 1), decA: () => this.bump(i, 0, -1),
incB: () => this.bump(i, 1, 1), decB: () => this.bump(i, 1, -1)
};
});
const mode = this.state.mode;
const btn = (on) => "flex:1;min-height:44px;font:inherit;cursor:pointer;text-align:center;padding:12px 6px;border-radius:10px;font-size:14px;" + (on ? "background:#14427A;color:#ffffff;border:1px solid #14427A;font-weight:700" : "background:#ffffff;color:#0B2545;border:1px solid #BCC8D6;font-weight:500");
const over = mode !== "n" || sa === 2 || sb === 2;
const winner = sa === 2 ? A : B;
const special = mode === "ret"
? { t: B + " פרש · " + A + " מנצח", n: "פרישה בגלל פציעה באישור שופט: הניקוד נקבע לפי השלב שהגיע אליו. בלי פציעה: ללא ניקוד." }
: { t: "ווק-אובר · " + A + " מנצח", n: "השחקן שלא הגיע מסומן. אם הודיע עד 12 שעות לפני ללא אישור רפואי, לא יקבל ניקוד. ללא הודעה: ניקוד אפס." };
return {
m1: btn(mode === "n"), m2: btn(mode === "ret"), m3: btn(mode === "wo"),
setNormal: () => this.setState({ mode: "n" }), setRet: () => this.setState({ mode: "ret" }), setWo: () => this.setState({ mode: "wo" }),
sets,
resultStyle: over
? "background:#E3F4EA;color:#14663C;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px"
: "background:#FDF0DC;color:#8A4B08;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px",
resultTitle: mode !== "n" ? special.t : (over ? winner + " מנצח " + Math.max(sa, sb) + "–" + Math.min(sa, sb) : "המשחק עדיין לא הסתיים"),
resultNote: mode !== "n" ? special.n : over ? "המנצח יועלה אוטומטית לחצי הגמר ויקבל התראה עם שעת ומגרש המשחק הבא." : "יש להזין תוצאה שמכריעה את המשחק לפני שמירה."
};
}
}
</script>
</body>
</html>
